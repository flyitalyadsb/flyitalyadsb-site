# The Astro site itself: build it and check it on every pull request and push
# to main. Cloudflare Pages builds and deploys it on its own; this job only
# catches what Pages would publish without complaint, starting with internal
# links that lack their trailing slash (each one a redirect for Google).
name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:links
